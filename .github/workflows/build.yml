name: Build OpenWrt

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt
        run: |
          git clone -b openwrt-24.10 --single-branch --depth 1 https://github.com/openwrt/openwrt.git

      - name: Cache download directory
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ runner.os }}-${{ hashFiles('.config') }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: openwrt
        run: |
          cp ../.config .config
          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8 || make download -j1 V=s

      - name: Patch mt76 TX power
        working-directory: openwrt
        run: |
          mkdir -p package/kernel/mt76/patches
          cp ../patches/999-fix-5g-txpower.patch package/kernel/mt76/patches/
          echo "Copied 999-fix-5g-txpower.patch to package/kernel/mt76/patches/"

      - name: Copy UCI defaults
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          cp files/etc/uci-defaults/99-custom openwrt/files/etc/uci-defaults/

      - name: Build
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s 2>&1 | tail -200 || make -j1 V=s 2>&1 | tail -200

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-xiaomi-r4a-gigabit
          path: |
            openwrt/bin/targets/ramips/mt7621/*xiaomi_mi-router-4a-gigabit*
          retention-days: 30

