name: Build OpenWrt

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt
        run: |
          git clone -b openwrt-24.10 --single-branch --depth 1 https://github.com/openwrt/openwrt.git
          cd openwrt
          echo "src-git-full packages https://git.openwrt.org/feed/packages.git;openwrt-24.10" > feeds.conf
          echo "src-git-full luci https://git.openwrt.org/project/luci.git;openwrt-24.10" >> feeds.conf

      - name: Apply mt76 TX power patch
        run: |
          mkdir -p openwrt/package/kernel/mt76/patches
          cp patches/999-fix-5g-txpower.patch openwrt/package/kernel/mt76/patches/

      - name: Copy UCI defaults
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          cp files/etc/uci-defaults/99-custom openwrt/files/etc/uci-defaults/

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cp .config openwrt/.config
          cd openwrt
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j8 V=s

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-xiaomi-r4a-gigabit
          path: |
            openwrt/bin/targets/ramips/mt7621/*xiaomi_mi-router-4a-gigabit*
          retention-days: 30
